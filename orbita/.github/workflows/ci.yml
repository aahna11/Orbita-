name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: orbita, MYSQL_DATABASE: orbita }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -porbita" --health-interval=5s --health-timeout=5s --health-retries=20
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env: { MYSQL_URL: 'mysql://root:orbita@127.0.0.1:3306/orbita', MONGO_URL: 'mongodb://127.0.0.1:27017/orbita', JWT_SECRET: ci-secret }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: node src/migrate.js
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm install && npm run build
        working-directory: client
